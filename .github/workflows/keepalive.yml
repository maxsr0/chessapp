# Render's free tier sleeps after 15 idle minutes, which stops the analysis worker and adds a
# ~1 minute cold start for the next visitor. Pinging /health every 10 minutes keeps it awake.
# One always-on service fits in Render's 750 free instance-hours a month. Uses the same
# NEXT_PUBLIC_API_URL repo variable as pages.yml. GitHub pauses scheduled workflows after
# 60 days without repo activity; re-enable it from the Actions tab if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.NEXT_PUBLIC_API_URL }}/health"
